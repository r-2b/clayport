<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home - Classroom</title>
<link type="image/png" href="//ssl.gstatic.com/classroom/favicon.png" rel="icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000;--fg:#ffe8e8;--muted:#8a6f6f;--card:#120606;--line:#2a1010;--accent:#d9826a;
  --c0:#ff5d73;--c1:#ff9f1c;--c2:#2ec4b6;--c3:#4361ee;--c4:#9b5de5;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16121f;--fg:#f5efe6;--muted:#a79bb8;--card:#221c30;--line:#352c47;
    --c0:#ff7b8e;--c1:#ffb547;--c2:#4fe0d0;--c3:#7b93ff;--c4:#c08bff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121f;--fg:#f5efe6;--muted:#a79bb8;--card:#221c30;--line:#352c47;
  --c0:#ff7b8e;--c1:#ffb547;--c2:#4fe0d0;--c3:#7b93ff;--c4:#c08bff;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:#1b1210;color:#f3d9cf;
  font-family:"Press Start 2P","Courier New",monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2rem;padding:1.5rem;overflow:hidden;
}
#stage{
  max-width:100%;text-align:center;
  font-weight:400;font-size:clamp(1.6rem,9.5vw,5.5rem);line-height:1.2;
  user-select:none;-webkit-user-select:none;
}
.w{display:inline-block;white-space:nowrap;margin:0 .14em}

.l{
  display:inline-block;transform-origin:50% 100%;color:var(--accent);text-shadow:.06em .06em 0 #7a3524,.12em .12em 0 #3d1a10;
  animation:
    drop .95s cubic-bezier(.3,.7,.4,1) calc(var(--i)*65ms) both,
    wave 2.2s ease-in-out calc(1s + var(--i)*65ms) infinite;
}
@keyframes drop{
  0%{transform:translateY(-70vh) scale(.8,1.3);opacity:0}
  8%{opacity:1}
  50%{transform:translateY(0) scale(1.35,.6)}
  68%{transform:translateY(-.35em) scale(.92,1.1)}
  84%{transform:translateY(0) scale(1.1,.9)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes wave{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-.12em) rotate(-3deg)}
  50%{transform:translateY(0) scale(1.06,.94)}
  75%{transform:translateY(-.06em) rotate(3deg)}
}
.bar{
  display:flex;gap:.6rem;width:min(30rem,100%);
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:.4rem;
}
.bar input{
  flex:1;min-width:0;border:0;background:transparent;color:var(--fg);
  font:inherit;font-size:1rem;padding:.5rem 1rem;outline:none;
}
.bar button{
  border:0;border-radius:999px;background:var(--accent);color:#04121a;
  font:inherit;font-weight:600;padding:.5rem 1.2rem;
}
.bar{background:#120606;border-color:#2a1010}
.hint{color:#8a6f6f;font-size:.85rem;margin:0}
@media (prefers-reduced-motion:reduce){.l{animation:drop .01s both}}
.pot{width:clamp(110px,24vw,200px);height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.potbtn{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.potbtn img{transform-origin:50% 100%}
.potbtn:focus-visible{outline:2px dashed var(--accent);outline-offset:8px}
.shard{position:absolute;pointer-events:none;image-rendering:pixelated;will-change:transform,opacity}
/* Main menu */
.menu-screen{
  position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.5rem;padding:2rem 1.25rem;
  box-sizing:border-box;background:rgba(18,10,12,.97);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility .35s ease;
}
.menu-screen.show{opacity:1;visibility:visible;pointer-events:auto}
.menu-inner{
  width:min(34rem,100%);text-align:center;padding:clamp(1.5rem,5vw,3rem);
  box-sizing:border-box;background:#211722;border:4px solid #d9826a;
  box-shadow:8px 8px 0 #090609, inset 0 0 0 4px #3d2935;
}
.menu-title{
  margin:0 0 1rem;color:#ffb39f;
  font-family:"Press Start 2P","Courier New",monospace;
  font-size:clamp(1.35rem,5vw,2.4rem);line-height:1.7;
  text-shadow:4px 4px 0 #7a3524;
}
.menu-subtitle{
  margin:0 0 2rem;color:#d8bdc4;font-size:clamp(.55rem,2vw,.75rem);
  line-height:2;font-family:"Press Start 2P","Courier New",monospace;
}
.menu-options{display:flex;flex-direction:column;align-items:center;gap:.85rem}
.menu-options button{
  width:min(19rem,100%);padding:1rem .8rem;border:2px solid #f3b09d;
  background:#d9826a;color:#211722;cursor:pointer;
  font-family:"Press Start 2P","Courier New",monospace;font-size:.7rem;
  line-height:1.7;box-shadow:4px 4px 0 #7a3524;
  transition:transform .12s ease,background .12s ease;
}
.menu-options button:hover{transform:translate(-2px,-2px);background:#ffb39f}
.menu-options button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #7a3524}
.menu-options button:focus-visible{outline:3px dashed #fff;outline-offset:5px}
.menu-status{
  min-height:1.5em;margin:1.5rem 0 0;color:#e3d7e4;
  font-family:"Press Start 2P","Courier New",monospace;font-size:.55rem;line-height:1.9;
}
@media(prefers-reduced-motion:reduce){.menu-screen,.menu-options button{transition:none}}

/* Clickable thumbnail and its blank page */
.thumbnail-grid{display:flex;justify-content:center;margin-top:1.5rem}
.thumbnail-card{width:clamp(150px,48vw,220px);padding:.65rem;background:#352536;
  border:3px solid #d9826a;box-shadow:5px 5px 0 #090609;color:#f5d9d0;cursor:pointer;
  text-align:left;font-family:"Press Start 2P","Courier New",monospace;transition:transform .15s ease}
.thumbnail-card:hover{transform:translateY(-4px)}
.thumbnail-card:focus-visible{outline:3px dashed white;outline-offset:5px}
.thumbnail-art{height:92px;display:grid;place-items:center;background:
  linear-gradient(135deg,transparent 45%,#54333b 46% 54%,transparent 55%),
  repeating-linear-gradient(0deg,#211722 0 12px,#2c202d 12px 24px);border:2px solid #8f5c60}
.thumbnail-art span{font-size:2.3rem;filter:drop-shadow(3px 3px 0 #090609)}
.thumbnail-art{height:auto;aspect-ratio:3/2;overflow:hidden;background:#071d61}.thumbnail-art img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}.thumbnail-label{display:block;margin:.7rem .1rem .15rem;font-size:.55rem;line-height:1.8}
.blank-view{position:fixed;inset:0;z-index:30;background:#171019;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}
.blank-view.show{opacity:1;visibility:visible;pointer-events:auto}
.blank-toolbar{height:64px;flex:0 0 64px;display:flex;align-items:center;padding:0 1rem;
  border-bottom:2px solid #352536;background:#211722;box-sizing:border-box}
.blank-back{padding:.7rem 1rem;border:2px solid #d9826a;background:#d9826a;color:#211722;
  font: .65rem "Press Start 2P","Courier New",monospace;cursor:pointer;box-shadow:3px 3px 0 #7a3524}
.blank-back:hover{background:#ffb39f}
.blank-content{flex:1;min-height:0;background:#000;overflow:hidden}#geometry-game{display:block;width:100%;height:100%;border:0;background:#000}
@media(prefers-reduced-motion:reduce){.thumbnail-card,.blank-view{transition:none}}


.example-game-menu{
  width:min(560px,calc(100% - 36px));margin:auto;text-align:center;
  padding:30px 20px;background:linear-gradient(180deg,#0755c8,#052b83);
  border:4px solid #8be7ff;box-shadow:8px 8px 0 #031746;
}
.example-game-menu h1{
  margin:0;color:#9cff38;font-family:"Press Start 2P","Courier New",monospace;
  font-size:clamp(1.1rem,4vw,2rem);line-height:1.8;
  -webkit-text-stroke:1px #173c13;
  text-shadow:3px 3px 0 #142b67;
}
.example-tagline{
  color:#d8f5ff;font: .58rem/2 "Press Start 2P","Courier New",monospace;
  margin:10px 0 28px;
}
.example-menu-buttons{display:flex;flex-direction:column;align-items:center;gap:14px}
.example-menu-buttons button{
  width:min(270px,100%);padding:16px 12px;
  border:3px solid #e8fbff;background:#76d92c;color:#12310a;
  box-shadow:5px 5px 0 #09245f;cursor:pointer;
  font: .7rem/1.7 "Press Start 2P","Courier New",monospace;
}
.example-menu-buttons button:hover{filter:brightness(1.12);transform:translateY(-2px)}
.example-message{min-height:1.5em;color:#e5faff;font:.55rem/2 "Press Start 2P","Courier New",monospace;margin:24px 0 0}
\n</style>
</head>

  openBlank.addEventListener('click',function(){
    if(!gameFrame.dataset.loaded){gameFrame.srcdoc=gameDocument;gameFrame.dataset.loaded='true';}
    blankView.classList.add('show');
    blankView.setAttribute('aria-hidden','false');
    backBlank.focus();
  });
  backBlank.addEventListener('click',function(){
    blankView.classList.remove('show');
    blankView.setAttribute('aria-hidden','true');
    openBlank.focus();
  });

  function showMenu(){
    menu.classList.add('show');
    menu.querySelector('button').focus();
  }
  function rnd(a,b){return a+Math.random()*(b-a)}
  function shatter(w,h){
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    img.style.visibility='hidden';
    if(reduce){setTimeout(showMenu,250);return}
    var cols=7,rows=Math.max(1,Math.round(cols*h/w));
    var pw=w/cols,ph=h/rows,fall=window.innerHeight*0.7;
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var d=document.createElement('div');
        d.className='shard';
        d.style.width=pw+'px';d.style.height=ph+'px';
        d.style.left=(c*pw)+'px';d.style.top=(r*ph)+'px';
        d.style.backgroundImage='url("'+img.src+'")';
        d.style.backgroundSize=w+'px '+h+'px';
        d.style.backgroundPosition=(-c*pw)+'px '+(-r*ph)+'px';
        btn.appendChild(d);
        var cx=(c+.5)/cols-.5;
        var dx=cx*rnd(260,520)+rnd(-40,40);
        var up=rnd(60,180)+(1-r/rows)*80;
        var rot=rnd(-540,540);
        d.animate([
          {transform:'translate(0,0) rotate(0deg)',opacity:1,easing:'ease-out'},
          {transform:'translate('+(dx*.5)+'px,'+(-up)+'px) rotate('+(rot*.4)+'deg)',opacity:1,offset:.3,easing:'ease-in'},
          {transform:'translate('+dx+'px,'+fall+'px) rotate('+rot+'deg)',opacity:0}
        ],{duration:rnd(900,1400),fill:'forwards'});
      }
    }
    setTimeout(showMenu,1400);
  }

  btn.addEventListener('click',function(){
    if(busy)return;
    busy=true;
    var w=img.offsetWidth,h=img.offsetHeight;
    var wig=img.animate([
      {transform:'rotate(0)'},{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},
      {transform:'rotate(-4deg)'},{transform:'rotate(0)'}
    ],{duration:260});
    wig.onfinish=function(){shatter(w,h)};
  });

  menu.querySelectorAll('[data-menu]').forEach(function(button){
    button.addEventListener('click',function(){
      var choice=button.getAttribute('data-menu');
      if(choice==='play')status.textContent='PLAY SELECTED — YOUR PROJECT CAN START HERE.';
      if(choice==='settings')status.textContent='SETTINGS — OPTIONS CAN BE ADDED HERE.';
      if(choice==='about')status.textContent='CLAYPORT — A LITTLE PLACE FOR BIG IDEAS.';
    });
  });
})();
