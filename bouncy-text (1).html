<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bouncy Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000;--fg:#ffe8e8;--muted:#8a6f6f;--card:#120606;--line:#2a1010;--accent:#d9826a;
  --c0:#ff5d73;--c1:#ff9f1c;--c2:#2ec4b6;--c3:#4361ee;--c4:#9b5de5;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16121f;--fg:#f5efe6;--muted:#a79bb8;--card:#221c30;--line:#352c47;
    --c0:#ff7b8e;--c1:#ffb547;--c2:#4fe0d0;--c3:#7b93ff;--c4:#c08bff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121f;--fg:#f5efe6;--muted:#a79bb8;--card:#221c30;--line:#352c47;
  --c0:#ff7b8e;--c1:#ffb547;--c2:#4fe0d0;--c3:#7b93ff;--c4:#c08bff;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:#1b1210;color:#f3d9cf;
  font-family:"Press Start 2P","Courier New",monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2rem;padding:1.5rem;overflow:hidden;
}
#stage{
  max-width:100%;text-align:center;
  font-weight:400;font-size:clamp(1.6rem,9.5vw,5.5rem);line-height:1.2;
  user-select:none;-webkit-user-select:none;
}
.w{display:inline-block;white-space:nowrap;margin:0 .14em}

.l{
  display:inline-block;transform-origin:50% 100%;color:var(--accent);text-shadow:.06em .06em 0 #7a3524,.12em .12em 0 #3d1a10;
  animation:
    drop .95s cubic-bezier(.3,.7,.4,1) calc(var(--i)*65ms) both,
    wave 2.2s ease-in-out calc(1s + var(--i)*65ms) infinite;
}
@keyframes drop{
  0%{transform:translateY(-70vh) scale(.8,1.3);opacity:0}
  8%{opacity:1}
  50%{transform:translateY(0) scale(1.35,.6)}
  68%{transform:translateY(-.35em) scale(.92,1.1)}
  84%{transform:translateY(0) scale(1.1,.9)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes wave{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-.12em) rotate(-3deg)}
  50%{transform:translateY(0) scale(1.06,.94)}
  75%{transform:translateY(-.06em) rotate(3deg)}
}
.bar{
  display:flex;gap:.6rem;width:min(30rem,100%);
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:.4rem;
}
.bar input{
  flex:1;min-width:0;border:0;background:transparent;color:var(--fg);
  font:inherit;font-size:1rem;padding:.5rem 1rem;outline:none;
}
.bar button{
  border:0;border-radius:999px;background:var(--accent);color:#04121a;
  font:inherit;font-weight:600;padding:.5rem 1.2rem;
}
.bar{background:#120606;border-color:#2a1010}
.hint{color:#8a6f6f;font-size:.85rem;margin:0}
@media (prefers-reduced-motion:reduce){.l{animation:drop .01s both}}
.pot{width:clamp(110px,24vw,200px);height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.potbtn{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.potbtn img{transform-origin:50% 100%}
.potbtn:focus-visible{outline:2px dashed var(--accent);outline-offset:8px}
.shard{position:absolute;pointer-events:none;image-rendering:pixelated;will-change:transform,opacity}
</style>
</head>

<script>
(function(){
  var stage=document.getElementById('stage');
  var TEXT='ClayPort';
  function render(){
    var text=TEXT;
    stage.textContent='';
    var i=0;
    text.split(/\s+/).forEach(function(word){
      var w=document.createElement('span');w.className='w';
      Array.from(word).forEach(function(ch){
        var s=document.createElement('span');
        s.className='l';s.textContent=ch;
        s.style.setProperty('--i',i);
        
        w.appendChild(s);i++;
      });
      stage.appendChild(w);
    });
  }
  
  
  
  render();
})();
(function(){
  var btn=document.getElementById('pot');
  var img=btn.querySelector('img');
  var busy=false;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function reset(shards){
    shards.forEach(function(s){s.remove()});
    img.style.visibility='visible';
    img.animate([
      {transform:'scale(.2)',opacity:0},
      {transform:'scale(1.15,.85)',opacity:1,offset:.6},
      {transform:'scale(.95,1.05)',offset:.8},
      {transform:'scale(1)'}
    ],{duration:600,easing:'ease-out'});
    busy=false;
  }
  function shatter(w,h){
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    img.style.visibility='hidden';
    if(reduce){setTimeout(function(){window.location.href='start.html'},600);return}
    var cols=7,rows=Math.max(1,Math.round(cols*h/w));
    var pw=w/cols,ph=h/rows,fall=window.innerHeight*0.7,shards=[];
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var d=document.createElement('div');
        d.className='shard';
        d.style.width=pw+'px';d.style.height=ph+'px';
        d.style.left=(c*pw)+'px';d.style.top=(r*ph)+'px';
        d.style.backgroundImage='url("'+img.src+'")';
        d.style.backgroundSize=w+'px '+h+'px';
        d.style.backgroundPosition=(-c*pw)+'px '+(-r*ph)+'px';
        btn.appendChild(d);shards.push(d);
        var cx=(c+.5)/cols-.5;
        var dx=cx*rnd(260,520)+rnd(-40,40);
        var up=rnd(60,180)+(1-r/rows)*80;
        var rot=rnd(-540,540);
        d.animate([
          {transform:'translate(0,0) rotate(0deg)',opacity:1,easing:'ease-out'},
          {transform:'translate('+(dx*.5)+'px,'+(-up)+'px) rotate('+(rot*.4)+'deg)',opacity:1,offset:.3,easing:'ease-in'},
          {transform:'translate('+dx+'px,'+fall+'px) rotate('+rot+'deg)',opacity:0}
        ],{duration:rnd(900,1400),fill:'forwards'});
      }
    }
    setTimeout(function(){window.location.href='start.html'},2800);
  }
  btn.addEventListener('click',function(){
    if(busy)return;busy=true;
    var w=img.offsetWidth,h=img.offsetHeight;
    var wig=img.animate([
      {transform:'rotate(0)'},{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},
      {transform:'rotate(-4deg)'},{transform:'rotate(0)'}
    ],{duration:260});
    wig.onfinish=function(){shatter(w,h)};
  });
})();
</script>
